name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Docs-only PRs skip the Rust job: Markdown and docs/ cannot change compiled
    # behavior, so the local fmt gate and PR review are enough for them.
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-windows:
    name: Format, Clippy & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run PowerShell style tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/sweep-style.tests.ps1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace test suite
        run: cargo test --workspace
