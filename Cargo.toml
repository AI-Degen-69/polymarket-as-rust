[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/feeds",
    "crates/math-engine",
    "crates/paper-sim",
    "crates/risk-lifecycle",
    "crates/execution",
    "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
alloy = { version = "1.6", default-features = false, features = ["signer-local", "sol-types"] }
arc-swap = "1.7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
core_affinity = "0.8"
dotenvy = "0.15"
futures-util = "0.3"
hdrhistogram = "7.5"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "http2"] }
rtrb = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Console", "Win32_System_Performance"] }
wiremock = "0.6"
