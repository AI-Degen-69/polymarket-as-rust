[workspace]
resolver = "2"
members = ["crates/core-types", "crates/cli"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
hdrhistogram = "7.5"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
windows-sys = { version = "0.59", features = ["Win32_Media", "Win32_System_Performance"] }
